[build-system]
requires = ["scikit-build-core>=0.10,<2", "pybind11>=2.11,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "iimt-native"
version = "0.1.0"
description = "Native CI-05 single/dual controller, planning and visualization without ROS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6", "matplotlib>=3.7", "pandas>=2"]
test = ["pytest>=8", "nbformat>=5", "nbclient>=0.10"]

[project.scripts]
iimt-mock = "iimt.mock:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/iimt"]
build-dir = "build/{wheel_tag}"
sdist.exclude = ["build", ".build", "vcpkg_installed", "dist", "wheelhouse", ".git", "results"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["iimt"]

[tool.black]
line-length = 100
